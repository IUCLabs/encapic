when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: test
    image: "artifactapi.example.com/docker-internal/gobuilder:0.1.3-alma9"
    environment:
      GOCACHE_S3_BUCKET: gocache
      GOCACHE_S3_REGION: us-east-1
      GOCACHE_S3_ENDPOINT_URL: "https://s3.example.com"
      GOCACHE_S3_PATH_STYLE: "true"
      GOCACHE_KEY_PREFIX: ci-encapic
      GOCACHEPROG: go-cache-plugin --cache-dir=/tmp/gocache
      AWS_ACCESS_KEY_ID:
        from_secret: GOCACHE_AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: GOCACHE_AWS_SECRET_ACCESS_KEY
    commands:
      - go test -race ./...
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2

  # goreleaser is the single driver for the release: it builds the static
  # binary, builds the RPM (nfpm is built in) and creates the Gitea release
  # with the binary, RPM and per-artifact sha256 files attached. The binary
  # asset name is unchanged — the puppet compilers pull it at pod start.
  - name: goreleaser
    image: "artifactapi.example.com/docker-internal/gobuilder:0.1.3-alma9"
    environment:
      GITEA_TOKEN:
        from_secret: RELEASER_TOKEN
      GOCACHE_S3_BUCKET: gocache
      GOCACHE_S3_REGION: us-east-1
      GOCACHE_S3_ENDPOINT_URL: "https://s3.example.com"
      GOCACHE_S3_PATH_STYLE: "true"
      GOCACHE_KEY_PREFIX: ci-encapic
      GOCACHEPROG: go-cache-plugin --cache-dir=/tmp/gocache
      AWS_ACCESS_KEY_ID:
        from_secret: GOCACHE_AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: GOCACHE_AWS_SECRET_ACCESS_KEY
    commands:
      # goreleaser reads the tag history for the changelog; Woodpecker's clone
      # can be shallow.
      - git fetch --tags --force
      - go install github.com/goreleaser/goreleaser/v2@v2.17.1
      - goreleaser release --clean
    depends_on: [test]
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2

  # goreleaser cannot PUT to artifactapi, so the RPM it built into dist/ is
  # published to the local rpm repo here (a real yum repo; repodata
  # regenerates automatically).
  - name: upload-rpm
    image: registry.example.com/example/almalinux9-base:20260606
    commands:
      - |
        HOST="https://artifactapi.example.com"
        REPO="rpm-internal"
        set -o pipefail
        VAULT="https://vault.example.com:8200"
        AUTH=$$(mktemp)
        VT=$$(jq -n --rawfile jwt /var/run/secrets/kubernetes.io/serviceaccount/token '{role:"ci-writer",jwt:$$jwt}' \
          | curl -sf -d @- "$$VAULT/v1/auth/kubernetes/login" | jq -er .auth.client_token) || exit 1
        printf 'X-Vault-Token: %s\n' "$$VT" | curl -sf -H @- "$$VAULT/v1/identity/oidc/token/artifactapi-writer" \
          | jq -er '"Authorization: Bearer " + .data.token' > "$$AUTH" || exit 1
        for rpm in dist/*.rpm; do
          FILE=$$(basename "$$rpm")
          # artifactapi has no HEAD route (returns 405); probe with GET against
          # the served path (RPMs are stored under Packages/) to avoid re-upload.
          code=$$(curl -s -o /dev/null -w '%{http_code}' "$$HOST/api/v2/remotes/$$REPO/files/Packages/$$FILE" || true)
          if [ "$$code" = "200" ]; then
            echo "$$FILE already exists in $$REPO (HTTP $$code); skipping upload"
            continue
          fi
          echo "Uploading $$FILE to $$REPO (existence probe returned $$code)"
          curl -f -X PUT \
            "$$HOST/api/v2/remotes/$$REPO/files/$$FILE" \
            -H "Content-Type: application/x-rpm" -H @"$$AUTH" \
            --data-binary @"$$rpm"
        done
    depends_on: [goreleaser]
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2
