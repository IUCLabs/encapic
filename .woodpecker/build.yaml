when:
  - event: pull_request

steps:
  - name: build
    image: golang:1.25
    commands:
      - make build
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2

  # The release itself only runs on a tag, so validate the packaging config and
  # build the artifacts (binary + RPM) here without publishing anything.
  - name: package
    image: golang:1.26
    commands:
      - git fetch --tags --force
      - go install github.com/goreleaser/goreleaser/v2@v2.17.1
      - goreleaser check
      - goreleaser release --snapshot --clean
      - ls -l dist/*.rpm dist/*.sha256
    depends_on: [build]
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2
