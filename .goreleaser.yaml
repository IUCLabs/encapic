version: 2

project_name: encapic

builds:
  - id: encapic
    main: .
    binary: encapic
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # Raw binary, not an archive: the puppetserver-compiler initContainer fetches
  # this exact asset name by URL and sha256-verifies it before installing it.
  - id: binaries
    ids: [encapic]
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: encapic
    ids: [encapic]
    package_name: encapic
    # encapic-<version>-1.x86_64.rpm
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: myorg
    homepage: https://github.com/IUCLabs/encapic
    maintainer: Ben Vincent <12552114+neoloc@users.noreply.github.com>
    description: Puppet exec ENC client for encapi
    license: MIT
    formats:
      - rpm
    release: "1"
    bindir: /usr/bin
    contents:
      # Puppet's exec node_terminus passes a certname and no environment, so
      # external_nodes points at this shim, which sources the URL first.
      - src: packaging/encapic-enc
        dst: /usr/bin/encapic-enc
        file_info:
          mode: 0755
      - src: completions/encapic.bash
        dst: /usr/share/bash-completion/completions/encapic
        file_info:
          mode: 0644
      - src: completions/_encapic
        dst: /usr/share/zsh/site-functions/_encapic
        file_info:
          mode: 0644

checksum:
  # One <artifact>.sha256 per file rather than a single checksums.txt: the
  # compiler initContainer fetches encapic_linux_amd64.sha256 next to the binary.
  split: true
  name_template: "{{ .ArtifactName }}.sha256"

signs:
  - artifacts: checksum
    cmd: scripts/sign.sh
    args: ["${artifact}", "${signature}"]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
