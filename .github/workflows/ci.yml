name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: IUCLabs/workflows/.github/workflows/pre-commit.yml@v0.1.0
    permissions:
      contents: read
    with:
      go_version_file: go.mod

  actions:
    uses: IUCLabs/workflows/.github/workflows/actions.yml@v0.1.0
    permissions:
      contents: read

  go:
    uses: IUCLabs/workflows/.github/workflows/go-ci.yml@v0.1.0
    permissions:
      contents: read
      pull-requests: read
    with:
      go_vet: false
      golangci_lint_version: v2.15.0

  release-snapshot:
    uses: IUCLabs/workflows/.github/workflows/release-vault-plugin.yml@v0.1.0
    # the called job declares the release permissions; snapshot skips Vault, signing and publishing
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      snapshot: true
      runs_on: ubuntu-latest
